name: IPA

# Builds an unsigned RiffnexApp.ipa on a Mac runner with xtool, so the owner can install it from
# Windows with a sideloading tool (which signs it with their Apple ID) — no WSL needed.
on:
  workflow_dispatch:
  push:
    branches: ["claude/m2-analysis", "main"]
    paths:
      - "Sources/**"
      - "App/**"
      - "Package.swift"
      - "xtool.yml"
      - ".github/workflows/ipa.yml"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --version
      - name: Build unsigned IPA (release)
        run: |
          xtool dev build --configuration release --ipa
          IPA=$(find xtool -maxdepth 1 -name "*.ipa" | head -1)
          test -n "$IPA"
          mkdir -p out
          cp "$IPA" "out/RIFFNEX-${GITHUB_SHA::7}.ipa"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: RIFFNEX-ipa
          path: out/*.ipa
          retention-days: 30
