name: Separation model

# Converts Demucs htdemucs_6s to Core ML on a Mac (Core ML validation needs macOS), validates it
# against PyTorch, and commits the model plus test fixtures back to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/separation/**"
      - ".github/workflows/separation-model.yml"

permissions:
  contents: write

concurrency:
  group: separation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install converter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.0 torchaudio==2.4.0 numpy==1.26.4 coremltools==8.1 einops julius omegaconf pyyaml tqdm dora-search
          pip install --no-deps demucs==4.0.1 openunmix==1.3.0
          python -c "import torch, coremltools; print(torch.__version__, coremltools.__version__)"

      - name: SDK probe (AVAudioPlayerNode start APIs)
        run: |
          H=$(xcrun --sdk iphoneos --show-sdk-path)/System/Library/Frameworks/AVFAudio.framework/Headers/AVAudioPlayerNode.h
          grep -n "play\|API_DEPRECATED" "$H" | head -60 || true

      - name: Convert and validate
        run: python tools/separation/convert_htdemucs.py

      - name: Commit model and fixtures
        run: |
          du -sh Sources/AnalysisEngine/Resources/Separation/htdemucs6s.mlpackage
          git config user.name "riffnex-ci"
          git config user.email "riffnex-ci@users.noreply.github.com"
          git add Sources/AnalysisEngine/Resources/Separation Tests/Fixtures/demucs-stft.json Tests/Fixtures/demucs-demo-envelopes.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add Core ML htdemucs_6s separation model and fixtures (generated by CI)"
          git push origin HEAD:${GITHUB_REF_NAME}
