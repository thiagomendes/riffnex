name: TestFlight

# Builds RIFFNEX on a Mac runner and uploads it to TestFlight.
#
# Needs four repository secrets (Settings › Secrets and variables › Actions), created by the owner:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, role Admin) and APPLE_TEAM_ID.
# Without them the job still builds and checks the archive (a dry run).
#
# How: xtool assembles the real app bundle (`xtool dev build`, the same build that installs on the
# phone); we wrap it in an .xcarchive and let `xcodebuild -exportArchive` sign it for App Store
# distribution with cloud-managed certificates through the API key, and upload it. No certificate
# or private key is stored in the repository or the secrets.
on:
  workflow_dispatch:
  push:
    branches: ["claude/m2-analysis", "main"]
    paths:
      - "Sources/**"
      - "App/**"
      - "Package.swift"
      - "xtool.yml"
      - ".github/workflows/testflight.yml"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      HAS_SECRETS: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --version

      - name: Build number
        run: |
          # Every upload needs a higher build number; the run number always grows.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION ($BUILD)"

      - name: Build the app with xtool
        run: |
          xtool dev build --configuration release
          APP=$(find xtool -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          # Apple requires the app's privacy manifest at the bundle root.
          cp App/PrivacyInfo.xcprivacy "$APP/"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "App: $APP"
          ls -la "$APP" | head -50
          plutil -p "$APP/Info.plist"
          du -sh "$APP"

      - name: Make the bundle App Store ready
        run: |
          # 1. App icon as a compiled asset catalog (App Store requires Assets.car + CFBundleIcons).
          CAT="$RUNNER_TEMP/Assets.xcassets"
          mkdir -p "$CAT/AppIcon.appiconset"
          sips -s format png -z 1024 1024 App/AppIcon.png --out "$CAT/AppIcon.appiconset/icon-1024.png" >/dev/null
          # App Store icons must not have an alpha channel.
          sips -s format jpeg "$CAT/AppIcon.appiconset/icon-1024.png" --out "$RUNNER_TEMP/icon.jpg" >/dev/null
          sips -s format png "$RUNNER_TEMP/icon.jpg" --out "$CAT/AppIcon.appiconset/icon-1024.png" >/dev/null
          cat > "$CAT/Contents.json" <<'EOF'
          {"info":{"author":"xcode","version":1}}
          EOF
          cat > "$CAT/AppIcon.appiconset/Contents.json" <<'EOF'
          {"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          xcrun actool "$CAT" --compile "$APP" --platform iphoneos --minimum-deployment-target 27.0 \
            --app-icon AppIcon --target-device iphone --output-format human-readable-text \
            --output-partial-info-plist "$RUNNER_TEMP/icon-info.plist"
          /usr/libexec/PlistBuddy -c "Merge $RUNNER_TEMP/icon-info.plist" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconFile" "$APP/Info.plist" 2>/dev/null || true
          rm -f "$APP/AppIcon.png"
          # 2. Build metadata App Store Connect checks: the SDK and Xcode that compiled the app
          #    (xtool on macOS builds with this runner's Xcode toolchain and iPhoneOS SDK).
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          XCODE_VERSION=$(xcodebuild -version | awk '/^Xcode/{print $2}')
          XCODE_BUILD=$(xcodebuild -version | awk '/Build version/{print $3}')
          XCODE_NUM=$(echo "$XCODE_VERSION" | awk -F. '{printf "%02d%d%d", $1, $2, ($3==""?0:$3)}')
          set_key() { /usr/libexec/PlistBuddy -c "Delete :$1" "$APP/Info.plist" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$APP/Info.plist"; }
          set_key DTPlatformName iphoneos
          set_key DTPlatformVersion "$SDK_VERSION"
          set_key DTPlatformBuild "$SDK_BUILD"
          set_key DTSDKName "iphoneos$SDK_VERSION"
          set_key DTSDKBuild "$SDK_BUILD"
          set_key DTXcode "$XCODE_NUM"
          set_key DTXcodeBuild "$XCODE_BUILD"
          set_key DTCompiler com.apple.compilers.llvm.clang.1_0
          set_key BuildMachineOSBuild "$(sw_vers -buildVersion)"
          plutil -lint "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIcon|DT|BuildMachine"
          ls -la "$APP" | grep -E "Assets.car|AppIcon"

      - name: Wrap it in an .xcarchive
        run: |
          NAME=$(basename "$APP")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          ARCHIVE=build/RIFFNEX.xcarchive
          mkdir -p "$ARCHIVE/Products/Applications" "$ARCHIVE/dSYMs"
          cp -R "$APP" "$ARCHIVE/Products/Applications/"
          # Ad-hoc signature so the bundle is well-formed; export re-signs it for distribution.
          codesign --force --deep --sign - "$ARCHIVE/Products/Applications/$NAME"
          cat > "$ARCHIVE/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>ApplicationProperties</key>
            <dict>
              <key>ApplicationPath</key><string>Applications/${NAME}</string>
              <key>Architectures</key><array><string>arm64</string></array>
              <key>CFBundleIdentifier</key><string>${BUNDLE_ID}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleVersion</key><string>${BUILD}</string>
              <key>SigningIdentity</key><string></string>
            </dict>
            <key>ArchiveVersion</key><integer>2</integer>
            <key>CreationDate</key><date>$(date -u +%Y-%m-%dT%H:%M:%SZ)</date>
            <key>Name</key><string>RIFFNEX</string>
            <key>SchemeName</key><string>RIFFNEX</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$ARCHIVE/Info.plist"
          echo "Bundle ID: $BUNDLE_ID"
          find "$ARCHIVE" -maxdepth 3 | head -20

      - name: Dry run note
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::TestFlight secrets are not set yet. The app and archive were built; nothing was uploaded."

      - name: Sign and upload to TestFlight
        if: env.HAS_SECRETS == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/RIFFNEX.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Build $VERSION ($BUILD) uploaded. It shows up in TestFlight after Apple finishes processing (usually 10–30 min)."

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
